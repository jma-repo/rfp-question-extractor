[project]
name = "rfpx"
version = "0.1.0"
description = "Proof of concept: pull the questions out of Word, PDF and Excel RFPs into one fixed-layout Word register, with a rules baseline and a local small model"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "James Ma" }]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-docx>=1.1",
    "docxtpl>=0.18",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
]

[project.scripts]
rfpx = "rfpx.cli:main"

[dependency-groups]
samples = [
    "reportlab>=4.2",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
default-groups = ["samples", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

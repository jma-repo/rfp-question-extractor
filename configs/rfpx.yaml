# Settings shared by `rfpx run` and `rfpx eval`. Command-line flags override them.

chunk:
  max_chars: 1400            # about 350 tokens of RFP text per model call; on the dev split 1,400 beat 2,400 for a 3B model (F1 0.95 vs 0.89)

dedupe:
  near_duplicate: 0.75       # token overlap above which a reworded repeat is flagged (never merged)

llm:
  base_url: http://127.0.0.1:1234/v1     # must be this machine; the client refuses anything else
  temperature: 0.0
  max_tokens: 1800
  retries: 1                 # one retry with the validation error sent back to the model
  recheck: false             # second pass per chunk: ask the model what was missed
  json_schema: auto          # auto | on | off: constrain the reply with response_format when the server supports it
  reasoning_effort: auto     # auto: "none" for qwen3 models (measured: no reasoning, 2.5 s instead of minutes), nothing for others
  timeout_s: 900

paths:
  template: templates/question_register.docx
  synthetic: data/synthetic
  reports: artifacts/reports
